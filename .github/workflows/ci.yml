name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check standalone release inputs
        shell: pwsh
        run: |
          $layout = Get-Content -LiteralPath release-layout.json -Raw | ConvertFrom-Json
          $info = Get-Content -LiteralPath info.json -Raw | ConvertFrom-Json
          if ($layout.schemaVersion -ne 1 -or $layout.profile -ne 'direct' -or $info.version -ne '1.3.0') {
            throw 'Unexpected standalone release metadata.'
          }
          foreach ($group in @('payload', 'documentation', 'licenses')) {
            foreach ($item in $layout.package.$group) {
              if ([IO.Path]::IsPathRooted($item.source) -or $item.source -match '(^|[\/])\.\.([\/]|$)' -or
                  -not $item.destination.StartsWith('RainbowFlame/')) {
                throw "Unsafe release mapping: $($item.source)"
              }
              if (-not (Test-Path -LiteralPath $item.source)) {
                throw "Missing release input: $($item.source)"
              }
            }
          }
          $resources = @(Get-ChildItem -LiteralPath payload/direct -Recurse -File)
          if ($resources.Count -ne 168 -or
              -not (Test-Path -LiteralPath bin/asset-redirect.dll -PathType Leaf)) {
            throw 'Incomplete direct resource payload.'
          }
          foreach ($file in $resources) {
            if ($file.Length -eq 0 -or $file.Name -notmatch '^[0-9a-f]{16}$') {
              throw "Unexpected resource: $($file.FullName)"
            }
          }

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Lua 5.1
        uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: '5.1.5'

      - name: Check Lua syntax
        shell: pwsh
        run: |
          $files = @('RainbowFlame.mod') + @(
            Get-ChildItem -LiteralPath scripts -Recurse -File -Filter '*.lua' |
              ForEach-Object FullName
          )
          foreach ($file in $files) {
            & luac -p -- $file
            if ($LASTEXITCODE -ne 0) { throw "Lua syntax check failed: $file" }
          }
