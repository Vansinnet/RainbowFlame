name: Feature request
description: Suggest a RainbowFlame improvement without submitting implementation code
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: Issues are welcome, but do not attach unsolicited code, patches, or derivative assets. Read CONTRIBUTING.md.
  - type: textarea
    id: request
    attributes:
      label: Requested behavior
      description: Describe the user-facing result you want.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation and use case
      description: Explain the problem this would solve.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility considerations
      description: Note relevant Darktide builds, settings, and potentially conflicting mods.
