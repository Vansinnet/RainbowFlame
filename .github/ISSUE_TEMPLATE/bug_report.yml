name: Bug report
description: Report a reproducible RainbowFlame problem
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Read SECURITY.md instead.
  - type: input
    id: release
    attributes:
      label: RainbowFlame release
      description: Use the version shown by the official release or installer.
    validations:
      required: true
  - type: input
    id: game_build
    attributes:
      label: Darktide build
      placeholder: "Build ID 24735202, executable 1.3.770.210"
    validations:
      required: true
  - type: dropdown
    id: install_method
    attributes:
      label: Installation method
      options:
        - Official RainbowFlame installer
        - Other or unknown
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the selected RainbowFlame settings and game context.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: DML, DMF, and mod conflicts
      description: List DML/DMF versions and other flame, particle, shader, or asset mods.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log excerpt
      description: Remove personal information and include only the relevant console-log excerpt.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: Darktide was closed while I installed or reinstalled RainbowFlame.
          required: true
        - label: I searched existing issues and removed conflicting asset mods where possible.
          required: true
